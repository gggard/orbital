{{- /*
These post-install/post-upgrade base-image build Jobs push through the same
registry as per-app builds, so they need the same registry-TLS trust as
build_job()/scripts.buildkitd_toml() (issue #78). The CA cert itself is
generated by registry.yaml (a normal, non-hook resource in this same
install/upgrade); `lookup` here can only see resources that existed BEFORE
this operation started, so on a fresh `helm install` with
registry.tls.enabled=true this lookup finds nothing yet even though the
Secret is created moments later in the same install - see the `fail` below.
*/ -}}
{{- $registryCACert := "" }}
{{- if (and .Values.registry.tls.enabled (or .Values.baseImages.build .Values.baseImages.buildStatic)) }}
{{- $tlsSecretName := include "orbital.registryTlsSecretName" . }}
{{- $tlsSecret := lookup "v1" "Secret" .Release.Namespace $tlsSecretName }}
{{- if not $tlsSecret }}
{{- fail (printf "registry.tls.enabled=true but Secret %s/%s doesn't exist yet - it's created earlier in this same install/upgrade, but `lookup` can't see resources from the in-progress operation. Re-run `helm upgrade` once more (the secret will exist by then, and these post-install base-image build hooks re-run every time) to build/push the base images, or set baseImages.build=false and baseImages.buildStatic=false to build them out-of-band instead." .Release.Namespace $tlsSecretName) }}
{{- end }}
{{- $registryCACert = index $tlsSecret.data "ca.crt" | b64dec }}
{{- end }}
{{- if .Values.baseImages.build }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orbital.fullname" . }}-base-image-build
  namespace: {{ .Values.builds.namespace }}
  labels: {{- include "orbital.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  Dockerfile: |
{{ .Files.Get "files/base-image.Dockerfile" | indent 4 }}
  buildkitd.toml: |
    [registry."{{ .Values.registry.pushUrl }}"]
    {{- if .Values.registry.tls.enabled }}
      ca=["/etc/buildkit/certs/ca.crt"]
    {{- else }}
      http = true
    {{- end }}
  {{- if .Values.registry.tls.enabled }}
  ca.crt: |
{{ $registryCACert | indent 4 }}
  {{- end }}
{{- range .Values.baseImages.pythonVersions }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "orbital.fullname" $ }}-base-py{{ . | replace "." "" }}-r{{ $.Release.Revision }}
  namespace: {{ $.Values.builds.namespace }}
  labels: {{- include "orbital.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {{- include "orbital.labels" $ | nindent 8 }}
      {{- if $.Values.builds.rootless }}
      annotations:
        container.apparmor.security.beta.kubernetes.io/buildkit: unconfined
      {{- end }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: buildkit
          image: {{ if $.Values.builds.rootless }}moby/buildkit:rootless{{ else }}moby/buildkit:latest{{ end }}
          command:
            - sh
            - -c
            - |
              buildctl-daemonless.sh build \
                --frontend dockerfile.v0 \
                --local context=/ctx --local dockerfile=/ctx \
                --opt build-arg:PYTHON_VERSION={{ . }} \
                --output type=image,name={{ $.Values.registry.pushUrl }}/streamlit-base:py{{ . }},push=true,registry.insecure={{ if $.Values.registry.tls.enabled }}false{{ else }}true{{ end }}
          env:
            - name: BUILDKITD_FLAGS
              value: {{ if $.Values.builds.rootless }}--oci-worker-no-process-sandbox{{ else }}""{{ end }}
          securityContext:
            {{- if $.Values.builds.rootless }}
            seccompProfile: {type: Unconfined}
            runAsUser: 1000
            runAsGroup: 1000
            {{- else }}
            privileged: true
            {{- end }}
          resources: {{- toYaml $.Values.builds.resources | nindent 12 }}
          volumeMounts:
            - name: ctx
              mountPath: /ctx
            - name: buildkitd-config
              mountPath: {{ if $.Values.builds.rootless }}/home/user/.config/buildkit/buildkitd.toml{{ else }}/etc/buildkit/buildkitd.toml{{ end }}
              subPath: buildkitd.toml
            {{- if $.Values.registry.tls.enabled }}
            - name: buildkitd-config
              mountPath: /etc/buildkit/certs/ca.crt
              subPath: ca.crt
            {{- end }}
      volumes:
        - name: ctx
          configMap:
            name: {{ include "orbital.fullname" $ }}-base-image-build
            items: [{key: Dockerfile, path: Dockerfile}]
        - name: buildkitd-config
          configMap:
            name: {{ include "orbital.fullname" $ }}-base-image-build
{{- end }}
{{- end }}

{{- if .Values.baseImages.buildStatic }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orbital.fullname" . }}-static-base-image-build
  namespace: {{ .Values.builds.namespace }}
  labels: {{- include "orbital.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  Dockerfile: |
{{ .Files.Get "files/static-base-image.Dockerfile" | indent 4 }}
  nginx.conf: |
{{ .Files.Get "files/static-base-image.nginx.conf" | indent 4 }}
  buildkitd.toml: |
    [registry."{{ .Values.registry.pushUrl }}"]
    {{- if .Values.registry.tls.enabled }}
      ca=["/etc/buildkit/certs/ca.crt"]
    {{- else }}
      http = true
    {{- end }}
  {{- if .Values.registry.tls.enabled }}
  ca.crt: |
{{ $registryCACert | indent 4 }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "orbital.fullname" . }}-base-static-r{{ .Release.Revision }}
  namespace: {{ .Values.builds.namespace }}
  labels: {{- include "orbital.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {{- include "orbital.labels" . | nindent 8 }}
      {{- if .Values.builds.rootless }}
      annotations:
        container.apparmor.security.beta.kubernetes.io/buildkit: unconfined
      {{- end }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: buildkit
          image: {{ if .Values.builds.rootless }}moby/buildkit:rootless{{ else }}moby/buildkit:latest{{ end }}
          command:
            - sh
            - -c
            - |
              buildctl-daemonless.sh build \
                --frontend dockerfile.v0 \
                --local context=/ctx --local dockerfile=/ctx \
                --output type=image,name={{ .Values.registry.pushUrl }}/{{ .Values.baseImages.staticTag }},push=true,registry.insecure={{ if .Values.registry.tls.enabled }}false{{ else }}true{{ end }}
          env:
            - name: BUILDKITD_FLAGS
              value: {{ if .Values.builds.rootless }}--oci-worker-no-process-sandbox{{ else }}""{{ end }}
          securityContext:
            {{- if .Values.builds.rootless }}
            seccompProfile: {type: Unconfined}
            runAsUser: 1000
            runAsGroup: 1000
            {{- else }}
            privileged: true
            {{- end }}
          resources: {{- toYaml .Values.builds.resources | nindent 12 }}
          volumeMounts:
            - name: ctx
              mountPath: /ctx
            - name: buildkitd-config
              mountPath: {{ if .Values.builds.rootless }}/home/user/.config/buildkit/buildkitd.toml{{ else }}/etc/buildkit/buildkitd.toml{{ end }}
              subPath: buildkitd.toml
            {{- if .Values.registry.tls.enabled }}
            - name: buildkitd-config
              mountPath: /etc/buildkit/certs/ca.crt
              subPath: ca.crt
            {{- end }}
      volumes:
        - name: ctx
          configMap:
            name: {{ include "orbital.fullname" . }}-static-base-image-build
            items:
              - {key: Dockerfile, path: Dockerfile}
              - {key: nginx.conf, path: nginx.conf}
        - name: buildkitd-config
          configMap:
            name: {{ include "orbital.fullname" . }}-static-base-image-build
{{- end }}

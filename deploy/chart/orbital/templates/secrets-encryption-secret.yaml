{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orbital.secretsEncryptionSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "orbital.labels" . | nindent 4 }}
stringData:
  encryption-key: {{ required "secrets.encryptionKey (or secrets.existingSecret) is required - see docs/ADMIN.md#secrets-encryption" .Values.secrets.encryptionKey | quote }}
{{- end }}

sonar.organization=gggard
sonar.projectKey=gggard_orbital

sonar.sources=src,cli/src,ui/src
sonar.tests=tests,cli/tests,ui/src
sonar.test.inclusions=ui/src/**/*.test.ts,ui/src/**/*.test.tsx,ui/src/test-utils/**

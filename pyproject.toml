[project]
name = "orbital"
version = "0.1.0"
description = "Self-hosted Streamlit hosting platform on Kubernetes"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sqlalchemy>=2.0.52",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "kubernetes>=36.0.3",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "itsdangerous>=2.2",
    "pyjwt[crypto]>=2.13.0",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocs-include-markdown-plugin>=7.3.0",
    "mkdocs-llmstxt>=0.5",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/orbital"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "B008",  # FastAPI's `Depends(...)` idiom relies on call-in-default-argument
    "UP042", # str+Enum mixin is intentional (SQLAlchemy/Pydantic serialization); revisit separately
]

[tool.ruff.lint.per-file-ignores]
"src/orbital/k8s/scripts.py" = ["E501"]  # embedded shell script templates, not Python code
"tests/*" = ["SIM117"]  # nested `with` blocks read better for stacked mock.patch

[tool.mypy]
python_version = "3.12"
packages = ["orbital"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
